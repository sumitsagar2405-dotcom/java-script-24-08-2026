<script>
    const requestUrl='https://api.github.com/users/sumitsagar2405-dotcom'

    const xhr = new XMLHttpRequest();
    xhr.open('GET',requestUrl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
        if(xhr.readyState===4){
            const data = JSON.parse(this.responseText)  <!---every time url se data string ke form mein hi aata hai aur sonme time maay be ye objecct-->
            console.log(data.followers);
            console.log(typeof data);
            
        }
    }
       
    xhr.send()
